<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveX | Premium Car Rental</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css .css">
</head>
    <body>
         <script src="https://unpkg.com/scrollreveal"></script>
    <script src="javascript.js"></script>
   
       <section class="signup-section" id="login-section">
    <div class="signup-container">
        <div class="signup-form-side">
            <h2>Welcome <span>Back</span></h2>
            <p class="subtitle">Log in to your DriveX account</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-submit" id="log">Log In</button>
            </form>
            
            <div class="signup-footer">
                Don't have an account? <a href="signup.html" id="create">Create Account</a>
            </div>
        </div>
        
        <div class="signup-brand" style="background: linear-gradient(135deg, #f14d07, #e66611);">
            <div class="brand-logo">
                <h2>Drive<span class="brand-span">X</span></h2>
                <p>Premium Car Rental</p>
            </div>
            <div class="brand-quote">
                <h3>Ready to Drive?</h3>
                <p>Log in to access your bookings, saved cars, and exclusive membership rewards.</p>
            </div>
            
        </div>
    </div>
    
</section>
<script>
        
       
   </script> 
    </body>
</html>
