<!DOCTYPE html>
<html>
      <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveX | Premium Car Rental</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css .css">
</head>
    <body>
        <section class="container" style="margin-top:120px;">
             <header><div class="nav container">
            <div class="header-btn">
        <button id="logoutButton" onclick="logout()" class="logoutButton">logout</button>
    </div></header>
<div class="heading">
<span>Contact Us</span>
<h1>Get In Touch</h1>
</div>

<div class="services-container container">

<div class="box">
<h3><i class='bx bxs-map'></i> Cairo, Egypt</h3>
<h3><i class='bx bxs-phone'></i> 01012345678</h3>
<h3><i class='bx bxs-envelope'></i> info@drivex.com</h3>

<h3>
<i class='bx bxl-facebook-circle'></i> 
<a href="https://www.facebook.com" target="_blank">Facebook</a>
</h3>

<h3>
<i class='bx bxl-instagram'></i> 
<a href="https://www.instagram.com" target="_blank">Instagram</a>
</h3>

<h3>
<i class='bx bxl-whatsapp'></i> 
<a href="https://wa.me/201012345678" target="_blank">WhatsApp</a>
</h3>

</div>

<div class="box">
<form onsubmit="sendMessage(event)">

<div class="input-box">
<input type="text" placeholder="Your Name" required>
</div>

<div class="input-box">
<input type="email" placeholder="Your Email" required>
</div>

<div class="input-box">
<textarea rows="5" placeholder="Your Message" required></textarea>
</div>

<br>
<input type="submit" value="Send Message" class="btn">

</form>
</div>

</div>

</section>

         <script src="https://unpkg.com/scrollreveal"></script>
    <script src="javascript.js"></script>
   
    </body>
</html>
