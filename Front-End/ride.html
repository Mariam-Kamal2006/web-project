<!DOCTYPE html>
<html>
      <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveX | Premium Car Rental</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css .css">
</head>
    <body>
         <script src="https://unpkg.com/scrollreveal"></script>
    <script src="javascript.js"></script>
    <header><div class="nav container">
            <div class="header-btn">
        <button id="logoutButton" onclick="logout()" class="logoutButton">logout</button>
    </div></header>
      <section class="ride" id="ride">
        <div class="heading"> <br> <br> <br> <br>
            <span>How It Works</span>
            <h1>Rent With 3 Easy Steps</h1>
        </div>
        <div class="ride-container container">
            <div class="box">
                <i class='bx bxs-map'></i>
                <h2>Choose A Location</h2>
                <p>Find the nearest pick-up point from over 500 locations nationwide.</p>
            </div>
            <div class="box">
                <i class='bx bxs-calendar-check'></i>
                <h2>Pick-Up Date</h2>
                <p>Select the date and time that fits your schedule perfectly.</p>
            </div>
            <div class="box">
                <i class='bx bxs-car'></i>
                <h2>Book Your Car</h2>
                <p>Confirm your booking and enjoy your premium driving experience.</p>
            </div>
        </div>
    </section>  
    </body>
</html>
